<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 10px;
            font-family: Arial, sans-serif;
        }
        .status {
            margin: 10px 0;
            padding: 5px;
            border-radius: 4px;
        }
        .status.connected {
            background-color: #e6ffe6;
            color: #006600;
        }
        .status.disconnected {
            background-color: #ffe6e6;
            color: #660000;
        }
        .browser-id {
            font-family: monospace;
            padding: 5px;
            background-color: #f5f5f5;
            border-radius: 4px;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h2>消息助手</h2>
    <div id="statusText" class="status disconnected">未连接</div>
    <div id="browserIdText" class="browser-id">未获取</div>
    <script src="popup.js"></script>
</body>
</html>
